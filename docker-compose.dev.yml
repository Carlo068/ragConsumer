# Development override -- adds hot reload to the app services by bind-mounting
# source over what the image baked in at build time, and swapping each
# service's start command for one that watches for changes.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# (docker-compose.yml alone is the production configuration, unchanged.)

services:
  backend:
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  ingestion-worker:
    volumes:
      - ./ingestion_worker/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  mcp_server:
    volumes:
      - ./mcp_server/app:/app/app
    # No uvicorn CLI here (mcp.run() is called directly in app/main.py), so
    # there's no built-in --reload -- watchfiles wraps the process and
    # restarts it whenever a file under app/ changes.
    command: watchfiles "python -m app.main" app

  frontend:
    build:
      context: ./frontend
      target: dev
    # Mount source files individually rather than the whole frontend/
    # directory -- node_modules is platform-specific (native esbuild/rollup
    # binaries), and shadowing the image's Linux-built node_modules with
    # whatever's installed on the host would break it (the same class of
    # bug as the pywin32-in-a-Linux-container issue elsewhere in this repo).
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/components.json:/app/components.json
      - ./frontend/.env:/app/.env
    environment:
      VITE_USE_POLLING: "true"
    command: npm run dev -- --host 0.0.0.0
    # Compose merges (concatenates) list fields like ports across -f files
    # by default rather than replacing them -- without !override this ends
    # up publishing BOTH the base file's 5173->80 (nginx, doesn't exist in
    # the dev image) and this file's 5173->5173, fighting over the same
    # host port.
    ports: !override
      - "127.0.0.1:5173:5173"
