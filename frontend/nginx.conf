server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing -- any path that isn't a real
    # static file must still serve index.html so the router can take over,
    # or a hard refresh on e.g. /collections/:id/upload 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
