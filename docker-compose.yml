services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ragconsumer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Registers a webhook notification target named INGEST -- minio-init
      # subscribes the bucket to it below.
      MINIO_NOTIFY_WEBHOOK_ENABLE_INGEST: "on"
      # Must be a hyphen, not an underscore: MinIO validates this hostname
      # against strict RFC 1123 syntax at its own startup, and rejects an
      # underscore as "invalid hostname" even though Docker's own DNS
      # resolves it fine (confirmed via `getent hosts` -- this cost real
      # debugging time, see KAN-37).
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_INGEST: "http://ingestion-worker:8001/webhook"
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # One-shot: creates the bucket and wires up the s3:ObjectCreated webhook to
  # ingestion-worker, then exits. Safe to re-run (mb/event add are idempotent).
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 2; done;
        mc mb --ignore-existing local/documents;
        mc event add local/documents arn:minio:sqs::INGEST:webhook --event put || true;
        exit 0
      "

  # Internal only: no published ports, so nothing outside the Docker network
  # can reach it. Every request needs the API key, and JWT mode lets the MCP
  # server present short-lived read-only tokens limited to a person's own
  # matters (one Qdrant collection per matter). The dev default key must be
  # replaced in production (KAN-73).
  qdrant:
    image: qdrant/qdrant:v1.19
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-dev-only-qdrant-key-replace-before-production}
      QDRANT__SERVICE__JWT_RBAC: "true"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ragconsumer}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: "False"
      MINIO_BUCKET: documents
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-dev-only-qdrant-key-replace-before-production}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"

  ingestion-worker:
    build: ./ingestion_worker
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ragconsumer}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: "False"
      MINIO_BUCKET: documents
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-dev-only-qdrant-key-replace-before-production}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:8001:8001"

  # One shared MCP server, always on the same URL. Every request must carry a
  # personal access key; the key identifies the person, and the server only
  # searches the matters that person turned on for their AI and still belongs
  # to. Matters are never a tool argument. Its Qdrant access is a short-lived
  # read-only token limited to those matters' collections.
  mcp_server:
    build: ./mcp_server
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ragconsumer}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-dev-only-qdrant-key-replace-before-production}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:8002:8002"

  frontend:
    build:
      context: ./frontend
      target: production
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
