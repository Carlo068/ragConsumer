# Every secret below is required: compose refuses to start if one is missing.
# Create them with `python scripts/generate_env.py` (see .env.example).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (python scripts/generate_env.py)}
      POSTGRES_DB: ${POSTGRES_DB:-ragconsumer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      # The root account is only for administration (minio-init, the console).
      # No running application uses it: the backend and the worker each have their
      # own limited user, created by minio-init below. Only the on-demand backup
      # tool uses it, to read (and on restore, write) every document.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env (python scripts/generate_env.py)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env (python scripts/generate_env.py)}
      # Registers a webhook notification target named INGEST -- minio-init
      # subscribes the bucket to it below.
      MINIO_NOTIFY_WEBHOOK_ENABLE_INGEST: "on"
      # Must be a hyphen, not an underscore: MinIO validates this hostname
      # against strict RFC 1123 syntax at its own startup, and rejects an
      # underscore as "invalid hostname" even though Docker's own DNS
      # resolves it fine (confirmed via `getent hosts` -- this cost real
      # debugging time, see KAN-37).
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_INGEST: "http://ingestion-worker:8001/webhook"
      # Sent with every notification; the worker refuses a call without it.
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_INGEST: ${MINIO_WEBHOOK_TOKEN:?Set MINIO_WEBHOOK_TOKEN in .env (python scripts/generate_env.py)}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # One-shot: creates the bucket, the two limited service users and their
  # policies, and wires up the s3:ObjectCreated webhook to ingestion-worker,
  # then exits. Safe to re-run: every step is idempotent, and a rerun also
  # applies a changed service secret.
  #   backend  -> may add and delete documents, and list them (delete a matter)
  #   worker   -> may only read documents
  minio-init:
    # mc version RELEASE.2025-08-13T08-35-41Z, pinned by digest so a new upstream image cannot change what runs here
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      - minio
    volumes:
      - ./minio/policies:/policies:ro
    # The secrets are passed as environment variables and expanded by the shell
    # ($$ is a literal $ for compose), so they are not written into the command
    # line that `docker inspect` and `ps` show.
    environment:
      ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      BACKEND_ACCESS: ${BACKEND_MINIO_ACCESS_KEY:?Set BACKEND_MINIO_ACCESS_KEY in .env}
      BACKEND_SECRET: ${BACKEND_MINIO_SECRET_KEY:?Set BACKEND_MINIO_SECRET_KEY in .env}
      WORKER_ACCESS: ${WORKER_MINIO_ACCESS_KEY:?Set WORKER_MINIO_ACCESS_KEY in .env}
      WORKER_SECRET: ${WORKER_MINIO_SECRET_KEY:?Set WORKER_MINIO_SECRET_KEY in .env}
    entrypoint: >
      /bin/sh -c "
        set -e;
        until mc alias set local http://minio:9000 \"$$ROOT_USER\" \"$$ROOT_PASSWORD\"; do sleep 2; done;
        mc mb --ignore-existing local/documents;
        mc admin policy create local backend-documents /policies/backend.json;
        mc admin policy create local worker-documents /policies/worker.json;
        mc admin user add local \"$$BACKEND_ACCESS\" \"$$BACKEND_SECRET\";
        mc admin user add local \"$$WORKER_ACCESS\" \"$$WORKER_SECRET\";
        mc admin policy attach local backend-documents --user \"$$BACKEND_ACCESS\" || true;
        mc admin policy attach local worker-documents --user \"$$WORKER_ACCESS\" || true;
        mc event add local/documents arn:minio:sqs::INGEST:webhook --event put || true;
        exit 0
      "

  # Internal only: no published ports, so nothing outside the Docker network
  # can reach it. Every request needs the API key, and JWT mode lets the MCP
  # server present short-lived read-only tokens limited to a person's own
  # matters (one Qdrant collection per matter).
  qdrant:
    image: qdrant/qdrant:v1.19
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env (python scripts/generate_env.py)}
      QDRANT__SERVICE__JWT_RBAC: "true"
    volumes:
      - qdrant_data:/qdrant/storage

  # One-shot, runs before the services start and then exits. It is the ONLY place
  # that holds the database owner's password: it brings the schema up to date and
  # creates the limited roles the backend, worker and MCP server connect as
  # (backend/scripts/db_roles.py), so none of them can read password hashes
  # (MCP, worker) or alter the audit log (any of them).
  migrate:
    build: ./backend
    image: ragconsumer-backend
    command: ["sh", "scripts/migrate.sh"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ragconsumer}
      SESSION_SECRET: not-used-by-migrations
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:?Set BACKEND_DB_PASSWORD in .env (python scripts/generate_env.py)}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:?Set MCP_DB_PASSWORD in .env (python scripts/generate_env.py)}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env (python scripts/generate_env.py)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    image: ragconsumer-backend
    environment:
      DATABASE_URL: postgresql+psycopg://ragapp_backend:${BACKEND_DB_PASSWORD:?Set BACKEND_DB_PASSWORD in .env (python scripts/generate_env.py)}@postgres:5432/${POSTGRES_DB:-ragconsumer}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (python scripts/generate_env.py)}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${BACKEND_MINIO_ACCESS_KEY:?Set BACKEND_MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${BACKEND_MINIO_SECRET_KEY:?Set BACKEND_MINIO_SECRET_KEY in .env}
      MINIO_SECURE: "False"
      MINIO_BUCKET: documents
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"

  ingestion-worker:
    build: ./ingestion_worker
    environment:
      DATABASE_URL: postgresql+psycopg://ragapp_worker:${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env (python scripts/generate_env.py)}@postgres:5432/${POSTGRES_DB:-ragconsumer}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${WORKER_MINIO_ACCESS_KEY:?Set WORKER_MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${WORKER_MINIO_SECRET_KEY:?Set WORKER_MINIO_SECRET_KEY in .env}
      MINIO_SECURE: "False"
      MINIO_BUCKET: documents
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      # The worker and the MCP server must use the same two values; changing
      # them means re-indexing (backend/scripts/reindex_all.py).
      DENSE_MODEL: ${DENSE_MODEL:-jinaai/jina-embeddings-v2-base-es}
      BM25_LANGUAGE: ${BM25_LANGUAGE:-spanish}
      # Downloaded models are kept in a volume, so redeploying does not fetch
      # ~600 MB again (and does not depend on the internet being reachable).
      FASTEMBED_CACHE_PATH: /models
      WEBHOOK_TOKEN: ${MINIO_WEBHOOK_TOKEN:?Set MINIO_WEBHOOK_TOKEN in .env (python scripts/generate_env.py)}
    volumes:
      - worker_models:/models
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:8001:8001"

  # One shared MCP server, always on the same URL. Every request must carry a
  # personal access key; the key identifies the person, and the server only
  # searches the matters that person turned on for their AI and still belongs
  # to. Matters are never a tool argument. Its Qdrant access is a short-lived
  # read-only token limited to those matters' collections.
  mcp_server:
    build: ./mcp_server
    environment:
      DATABASE_URL: postgresql+psycopg://ragapp_mcp:${MCP_DB_PASSWORD:?Set MCP_DB_PASSWORD in .env (python scripts/generate_env.py)}@postgres:5432/${POSTGRES_DB:-ragconsumer}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:8002}
      DENSE_MODEL: ${DENSE_MODEL:-jinaai/jina-embeddings-v2-base-es}
      BM25_LANGUAGE: ${BM25_LANGUAGE:-spanish}
      FASTEMBED_CACHE_PATH: /models
    volumes:
      - mcp_models:/models
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:8002:8002"

  # On-demand backup and restore tool (never runs by itself):
  #   docker compose --profile tools run --rm backup backup
  # See docs/deployment/05-backups.md. Backups are encrypted to a public key,
  # copied to an off-server bucket, and pruned by the retention policy.
  backup:
    profiles: ["tools"]
    image: ragconsumer-backup
    build: ./deploy/backup
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-ragconsumer}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: documents
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-ragconsumer}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_PRUNE_REMOTE: ${BACKUP_PRUNE_REMOTE:-true}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      BACKUP_ALLOW_LOCAL_ONLY: ${BACKUP_ALLOW_LOCAL_ONLY:-false}
    volumes:
      - backup_data:/backups

  frontend:
    build:
      context: ./frontend
      target: production
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"

volumes:
  backup_data:
  worker_models:
  mcp_models:
  postgres_data:
  minio_data:
  qdrant_data:
